# FLEET DEAD-MAN -- external cross-fleet monitor (Task 6, DEADMAN_APPROACH=GITHUB-ACTION,
# Gabriel-ratified 2026-07-09).
#
# WHY THIS LIVES ON GITHUB: on 2026-07-05 a Desktop app reinstall destroyed the CC/MCP
# scheduled-task registry, and the one guard built to catch that was itself a fleet
# member and died with it (~14 CC functions dark ~3 weeks). This monitor runs OUTSIDE
# the machine, so it survives total local fleet loss -- if the machine stops pushing a
# fresh heartbeat, THIS still fires.
#
# HOW (v2, OI-323): maintenance/publish-fleet-heartbeat.py, run daily by
# maintenance/push-fleet-heartbeat.ps1, writes ONLY the heartbeat JSON (counts + registry
# hashes, nothing sensitive) to the `deadman-heartbeat` branch through the GitHub API -- no
# git push, no pre-push gate, no race with main. (v1 rode `git push origin main`, so an
# unrelated failing hook test or a main that moved mid-gate kept it off GitHub for days.)
# This workflow checks that branch out at hb/ and FAILS when:
#   (a) heartbeat timestamp older than 24h vs run time
#   (b) cc  enabled-recurring count < its floor   } floors are READ from
#   (c) lams enabled-recurring count < its floor  } maintenance/_shared/scheduler-stores.json
#       `fleetFloors` (the single source of truth, checked out from this repo) -- NEVER
#       hardcode them here. A hardcoded {"cc":10,"lams":18} drifted from the SSOT (cc 13 /
#       lams 4) and failed every run from 2026-09-22. LAMS floor is 0 because the LAMS/Cowork
#       fleet is deliberately dark (Gabriel ruling 2026-10-30); a non-int LAMS count still trips.
#   (d) heartbeat file missing or unparseable
#   (e) either registry existence flag is false (LAMS included, even while dark)
#   (f) the AM cluster did not complete on time -- heartbeat ts later than 08:00 America/
#       New_York on the run date (ADDED 2026-07-28, Gabriel-directed)
#   (g) the floors SSOT is missing, unparseable or holds a non-int floor -- fail CLOSED
#       (ADDED 2026-11-05); the other checks still run.
#
# WHY (f) EXISTS: (a)'s 24h window is calibrated for TOTAL fleet loss and is structurally
# blind to the recurring failure that actually happens -- the machine/Desktop app sitting
# closed overnight, so the whole 05:15-06:30 ET cluster fires hours late in a catch-up
# burst. Worked example, 2026-07-28: ora-health-guard woke 217 min late (08:52 ET vs its
# 05:15 target) and ora-am-brief at 08:54 ET, missing the pre-06:00 mirror contract
# entirely -- yet the heartbeat was pushed at 12:54 UTC during that same burst, so at the
# 13:00 UTC run it was 0.1h old and this dead-man passed clean. Five such bursts in seven
# days (07-22/24/26/27/28) were each found only by automation-health-monitor at ~11:05 ET,
# a 3-6h silent gap. (f) closes the half that matters most: if the machine is STILL down
# at run time, no on-machine alert can fire at all -- ora-health-guard's own Block A.0
# wake-lateness alert only works once the machine actually wakes. This check runs off-box
# and does not need the machine to come back.
#
# NOTE on the DST-aware deadline: the deadline is computed in America/New_York, not as a
# fixed UTC hour, because the local push is scheduled in LOCAL time (07:30 ET) while cron
# is UTC -- a fixed UTC deadline is correct in summer and wrong by an hour in winter.
# On failure it opens ONE GitHub issue PER FAILURE CLASS (stale, am-late, am-not-run,
# floor-cc, floor-lams, registry-cc, registry-lams, heartbeat-missing, ts-unparseable,
# floors-config), titled "FLEET DEAD-MAN [<class>]: ...", and comments on that class's open
# issue on repeat. CHANGED 2026-11-05: the old dedupe matched any open "FLEET DEAD-MAN:"
# title, so every later failure (e.g. the floor drift from 2026-09-22) was appended as a
# comment to issue #19, opened 2026-07-19 for a stale heartbeat, and a new failure class
# never opened its own issue or email. That legacy "FLEET DEAD-MAN:" title no longer
# matches any class and is left alone.
#
# EMAIL LEG: rides GitHub's NATIVE issue-notification email to the repo owner
# (ggoldberg's GitHub account) -- no SMTP is wired (no secrets exist for it).
# GABRIEL: confirm this repo's notification settings actually deliver issue emails
# (repo Watch setting "All Activity", and Settings -> Notifications -> email enabled).
#
# Schedule: 14:00 UTC daily (10:00 ET summer / 09:00 ET winter). MOVED from 13:00 UTC on
# 2026-07-28 so check (f) has usable margin year-round: the 08:00 ET grace deadline (tightened
# from 08:30 the same day, see the code comment in the evaluator) lands at 13:00 UTC in winter,
# which a 13:00 UTC run would evaluate AT the deadline, not after it. 14:00 UTC leaves ~120min
# margin in summer and ~60min in winter, and still alarms
# ahead of automation-health-monitor's 11:05 ET catch. (a)'s 24h total-loss check is not
# hour-sensitive, so the 1h shift costs it nothing.
# Runbook on alarm: memory/oxford-cc-repo-health.md
# (locally: ~/.claude/projects/C--Users-Owner-OneDrive---Oxford-Capital-Partners/memory/).

name: fleet-deadman

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  deadman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # continue-on-error: a missing branch must surface as check (d) below (file missing),
      # not as a crashed checkout step that opens no issue.
      - name: Check out heartbeat branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: deadman-heartbeat
          path: hb

      - name: Evaluate heartbeat
        id: check
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo

          HB_PATH = "hb/fleet-heartbeat.json"
          MAX_AGE_H = 24
          # Floors come from the single source of truth (checked out at the workspace root by the
          # first checkout step) -- see header (b)/(c)/(g). A count below floor = silent registry shrink.
          FLOORS_PATH = "maintenance/_shared/scheduler-stores.json"
          FLEET_LABELS = ("cc", "lams")
          # (f) AM-cluster completion deadline, LOCAL time (see header). The local push is
          # scheduled 07:30 ET (and also runs via ora-task-integrity-guard STEP 1.5 at 07:05
          # + ~10min jitter), so normal completion is ~07:15-07:45 ET. 08:00 leaves ~15-45min
          # of grace. Deliberately NOT looser: at a 08:30 deadline the real 2026-07-28 burst
          # tripped by only 24 min, meaning a burst that recovered before 08:30 would have
          # passed silently -- and a machine back at 08:15 still means the AM cluster ran ~3h
          # late. Bias is toward catching the miss; a false positive here costs one deduped
          # GitHub issue, a false negative costs another silent 3-6h gap.
          AM_TZ = ZoneInfo("America/New_York")
          AM_DEADLINE_LOCAL_H, AM_DEADLINE_LOCAL_M = 8, 0

          reasons, lines = [], []
          classes = {}  # failure class -> first reason; one GitHub issue per class

          def fail(cls, reason):
              reasons.append(reason)
              classes.setdefault(cls, reason)

          # (g) floors from the SSOT -- fail CLOSED on anything but non-negative ints
          FLOORS = None
          try:
              with open(FLOORS_PATH, encoding="utf-8") as f:
                  ff = json.load(f)["fleetFloors"]
              FLOORS = {k: ff[k] for k in FLEET_LABELS}
              for k, v in FLOORS.items():
                  if not isinstance(v, int) or isinstance(v, bool) or v < 0:
                      raise ValueError("floor %s=%r is not a non-negative int" % (k, v))
              lines.append("- floors: %s (from `%s`)"
                           % (", ".join("%s>=%d" % kv for kv in FLOORS.items()), FLOORS_PATH))
          except Exception as e:
              FLOORS = None
              fail("floors-config", "fleet floors unreadable from `%s` (%s: %s) -- count checks "
                   "(b)/(c) skipped" % (FLOORS_PATH, e.__class__.__name__, e))

          hb = None
          try:
              with open(HB_PATH, encoding="utf-8") as f:
                  hb = json.load(f)
          except FileNotFoundError:  # (d) branch absent (never published) or file not on it
              fail("heartbeat-missing",
                   "heartbeat file missing or unparseable (FileNotFoundError): branch "
                   "`deadman-heartbeat` is absent or has no fleet-heartbeat.json -- has "
                   "publish-fleet-heartbeat.py ever published?")
          except Exception as e:  # (d) unparseable
              fail("heartbeat-missing",
                   "heartbeat file missing or unparseable (%s)" % e.__class__.__name__)

          if hb is not None:
              ts_raw = hb.get("ts")
              lines.append("- heartbeat ts: `%s`" % ts_raw)
              lines.append("- probe version: `%s`" % hb.get("probe_version"))
              try:  # (a) staleness
                  ts = datetime.datetime.strptime(ts_raw, "%Y-%m-%dT%H:%M:%SZ").replace(
                      tzinfo=datetime.timezone.utc)
                  age_h = (datetime.datetime.now(datetime.timezone.utc) - ts).total_seconds() / 3600
                  lines.append("- heartbeat age: %.1fh (max %dh)" % (age_h, MAX_AGE_H))
                  if age_h > MAX_AGE_H:
                      fail("stale", "heartbeat stale (%.1fh > %dh)" % (age_h, MAX_AGE_H))
                  # --- (f) AM cluster completed late / not at all ---
                  # Deadline is AM_DEADLINE_LOCAL_* on the RUN's local date. Two failures land
                  # here: heartbeat still from a previous day (machine never came back --
                  # (a) also catches this once past 24h, but this catches it sooner), and
                  # heartbeat from today but pushed after the deadline (catch-up burst).
                  now_local = datetime.datetime.now(AM_TZ)
                  deadline_local = now_local.replace(
                      hour=AM_DEADLINE_LOCAL_H, minute=AM_DEADLINE_LOCAL_M,
                      second=0, microsecond=0)
                  ts_local = ts.astimezone(AM_TZ)
                  lines.append("- AM deadline: `%s` · heartbeat local: `%s`"
                               % (deadline_local.strftime("%Y-%m-%d %H:%M %Z"),
                                  ts_local.strftime("%Y-%m-%d %H:%M %Z")))
                  if ts_local.date() < now_local.date():
                      fail("am-not-run",
                          "AM cluster has NOT run today -- newest heartbeat is from %s "
                          "(machine/Desktop app likely still closed)" % ts_local.date())
                  elif ts_local > deadline_local:
                      fail("am-late",
                          "AM cluster completed LATE -- heartbeat pushed %s, %.0f min past "
                          "the %02d:%02d ET deadline (overnight-offline catch-up burst; the "
                          "05:15-06:30 ET tasks fired late and ora-am-brief's pre-06:00 "
                          "mirror contract was missed)"
                          % (ts_local.strftime("%H:%M %Z"),
                             (ts_local - deadline_local).total_seconds() / 60,
                             AM_DEADLINE_LOCAL_H, AM_DEADLINE_LOCAL_M))
              except Exception:
                  fail("ts-unparseable", "heartbeat timestamp unparseable (%r)" % ts_raw)
              for label in FLEET_LABELS:  # (b)/(c) counts, (e) existence
                  count = (hb.get("fleets") or {}).get(label)
                  reg = (hb.get("registries") or {}).get(label) or {}
                  floor = FLOORS[label] if FLOORS is not None else None
                  lines.append("- %s: count=%s (floor %s) · registry exists=%s · sha256=%s"
                               % (label, count, "n/a" if floor is None else floor,
                                  reg.get("exists"), reg.get("sha256")))
                  if floor is not None and (not isinstance(count, int) or isinstance(count, bool)
                                            or count < floor):
                      fail("floor-" + label,
                           "%s enabled count %r below ratified floor %d" % (label, count, floor))
                  if reg.get("exists") is not True:
                      fail("registry-" + label, "%s registry file existence flag is false" % label)

          alert = bool(reasons)
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          body = "\n".join(
              ["**ORA fleet dead-man tripped** (run %s UTC)." % datetime.datetime.now(
                  datetime.timezone.utc).strftime("%Y-%m-%d %H:%M"),
               "", "Failure condition(s):"]
              + ["- %s" % r for r in reasons]
              + ["", "Parsed heartbeat values:"] + (lines or ["- (none -- file unreadable)"])
              + ["",
                 "Runbook: `memory/oxford-cc-repo-health.md` (July 2026 fleet-loss incident record; "
                 "locally under `~/.claude/projects/C--Users-Owner-OneDrive---Oxford-Capital-Partners/memory/`).",
                 "First checks: is the Desktop app open on the workstation? Did "
                 "`maintenance/push-fleet-heartbeat.ps1` publish last night (its .log, lines starting `publish:`; "
                 "`python maintenance/publish-fleet-heartbeat.py --status`)? Then run "
                 "`maintenance/registry-membership-probe.py` locally for the per-task drop detail."])
          with open("deadman-body.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          # one entry per failure class, consumed by the issue step (one issue per class)
          with open("deadman-classes.json", "w", encoding="utf-8") as f:
              json.dump([{"class": c, "reason": r} for c, r in classes.items()], f)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("alert=%s\n" % str(alert).lower())
              out.write("reason=%s\n" % (reasons[0] if reasons else "healthy"))
              out.write("date=%s\n" % today)

          print(("ALERT: " + "; ".join(reasons)) if alert else "OK -- heartbeat healthy")
          for ln in lines:
              print(" " + ln)
          PY

      - name: Open or update dead-man issues (one per failure class)
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.check.outputs.date }}
        run: |
          python3 - <<'PY'
          # Dedupe PER FAILURE CLASS (see header): each class gets its own issue titled
          # "FLEET DEAD-MAN [<class>]: <reason> — <date>". A class with an open issue gets a
          # comment; a class without one opens a new issue, so a new failure mode is never
          # buried as a comment on an older, unrelated issue. The match is on the exact
          # "[<class>]" token, never a bare prefix.
          import json, os, subprocess

          repo, run_date = os.environ["GITHUB_REPOSITORY"], os.environ["RUN_DATE"]
          with open("deadman-classes.json", encoding="utf-8") as f:
              classes = json.load(f)
          res = subprocess.run(["gh", "issue", "list", "--repo", repo, "--state", "open",
                                "--limit", "500", "--json", "number,title"],
                               capture_output=True, text=True, check=True)
          open_issues = json.loads(res.stdout or "[]")
          for entry in classes:
              cls, reason = entry["class"], entry["reason"]
              prefix = "FLEET DEAD-MAN [%s]:" % cls
              hit = next((i for i in open_issues if i["title"].startswith(prefix)), None)
              if hit:
                  print("class %s: open issue #%s exists -- commenting." % (cls, hit["number"]))
                  subprocess.run(["gh", "issue", "comment", str(hit["number"]), "--repo", repo,
                                  "--body-file", "deadman-body.md"], check=True)
              else:
                  title = "%s %s — %s" % (prefix, reason[:180], run_date)
                  print("class %s: no open issue -- creating %r." % (cls, title))
                  subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", title,
                                  "--body-file", "deadman-body.md"], check=True)
          PY

      - name: Fail run on alert
        if: steps.check.outputs.alert == 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::error::FLEET DEAD-MAN tripped: $REASON"
          exit 1
