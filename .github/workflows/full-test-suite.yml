# FULL TEST SUITE -- the authoritative test gate for ora-claude-config (added 2026-11-06,
# Gabriel-approved).
#
# WHY: the local pre-push hook-tests gate (hooks/git-prepush-hook-tests-gate.py) now runs
# a LIGHT tier on feature-branch pushes -- only the test files the pushed diff touches,
# plus a small always-run set -- because under multi-session load the full ~170-file
# suite blew its timeouts and blocked unrelated one-file pushes (two
# allow-hook-test-failure overrides on 2026-11-06 alone). The FULL suite moved here so it
# still runs on every change before merge. A PR merges only when this job is green -- a
# merge-procedure rule, NOT GitHub-enforced (main has no required status check; see
# tech.md 3j). Selection rules and their limits: hooks/lib/prepush_test_selection.py.
#
# NOT A BACKSTOP for tests that ENV-SKIP without gitignored live files (notably
# test-confidentiality-guard.py): they skip here. Their coverage is FULL runs in the main
# checkout; any pushed path containing "confidential" forces the local FULL tier.
#
# NO OVERRIDE PATH: this job sets no CLAUDE_CODE_SESSION_ID, so the gate's
# allow-hook-test-failure token can never be honored here -- a red run stays red.
#
# windows-latest, not ubuntu: the suite is written for and validated on Windows
# (PowerShell suites, Windows path handling); a Linux run would fail on environment, not
# on regressions. Gitignored live files (e.g. hooks/confidential-terms.json) are absent
# in a fresh checkout by design; tests that need them declare ENV-SKIP ("CANNOT RUN:"),
# exactly as they do in any linked worktree.
#
# WHEN THE SUITE RUNS (cost trim 2026-11-08, Gabriel-chosen). windows-latest bills 2x on
# this private repo and a FULL run takes ~15 min (~30 billed min). A ~10 s ubuntu
# `classify` job decides first:
#   * pull_request: runs, except on a DRAFT (marking it ready re-fires via ready_for_review).
#   * push to main: runs when the pushed commit was made BY GITHUB (committer "GitHub":
#     every PR merge, squash or merge commit, and any web-UI/API edit) OR is a PR's merge
#     commit (commits/{sha}/pulls, matched on merge_commit_sha). Either signal is enough,
#     so an API lag cannot silently skip a PR merge. That run tests the tree that actually
#     landed: a PR can merge cleanly while BEHIND main, and its PR run tested the older
#     base. A direct `git push` to main (auto-reconcile merge, heartbeat/backup push) is
#     SKIPPED: the pre-push gate already ran the FULL tier locally for any ref updating main.
#     Accepted gap (Gabriel, 2026-11-08), each re-checked only by the weekly run (up to
#     7 days): a direct push whose local FULL run passed via an allow-hook-test-failure
#     override, or only thanks to local state (untracked files, uncommitted edits -- the
#     gate tests the working tree, not the pushed commit), or that came from a clone with
#     no pre-push shim installed.
#   * schedule (weekly, main) and workflow_dispatch: always run. The weekly run is that
#     gap's backstop.
#   * The PR lookup fails OPEN: if the API call errors, the suite runs.
# Replayed over 2026-10-25..11-08: 42 of 61 main commits were PR merges (committer GitHub
# AND merge_commit_sha match on all 42; still run), 19 direct pushes (neither; now skipped).
name: Full test suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 0" # Sundays 09:17 UTC: weekly FULL backstop on main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # classify: commits/{sha}/pulls lookup

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          COMMITTER: ${{ github.event.head_commit.committer.name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          run=true; why="$EVENT"
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            run=false; why="draft PR (runs when marked ready)"
          elif [ "$EVENT" = "push" ] && [ "$COMMITTER" = "GitHub" ]; then
            why="commit made by GitHub on main (PR merge or web/API edit)"
          elif [ "$EVENT" = "push" ]; then
            if n=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$SHA\")] | length"); then
              if [ "$n" = "0" ]; then
                run=false; why="direct push to main, not a PR merge commit (FULL tier ran locally at pre-push)"
              else
                why="PR merge commit on main"
              fi
            else
              why="PR lookup failed -- failing open, running the suite"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice title=full-test-suite::run=$run ($why)"

  full-test-suite:
    needs: classify
    if: needs.classify.outputs.run == 'true'
    # Concurrency lives on THIS job, not the workflow: a run that classify skips never
    # joins the group, so it cannot cancel another run's PENDING slot (GitHub keeps one
    # pending run per group and drops the older one even with cancel-in-progress false).
    # Only a newer push to the SAME PR cancels an in-progress run.
    concurrency:
      group: full-test-suite-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (= v4.4.0)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (resolved via git ls-remote 2026-11-06)
        with:
          python-version: "3.13"

      # Third-party modules the suite imports (first CI run, 2026-11-06: three files died
      # on ModuleNotFoundError). Pinned to the versions on the dev box.
      - name: Test dependencies
        shell: bash
        # tzdata: zoneinfo on Windows has no system tz database (America/New_York lookups
        # raised ZoneInfoNotFoundError on the second CI run).
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 openpyxl==3.1.5 PyYAML==6.0.3 tzdata==2025.2

      # Reproduce the dev-box layout the suite is written against: the repo IS
      # %USERPROFILE%\.claude (tests and probes resolve ~/.claude, and several guards key
      # on C:/Users/Owner), and local time is America/New_York (DST-boundary tests). The
      # first CI run failed ~14 files on exactly these assumptions, none on a regression.
      - name: Emulate the ~/.claude dev-box layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Users\Owner | Out-Null
          New-Item -ItemType Junction -Path C:\Users\Owner\.claude -Target $env:GITHUB_WORKSPACE | Out-Null
          "USERPROFILE=C:\Users\Owner" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HOME=C:\Users\Owner" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # TEMP under the emulated home too: tests compute paths relative to it.
          New-Item -ItemType Directory -Force -Path C:\Users\Owner\AppData\Local\Temp | Out-Null
          "TEMP=C:\Users\Owner\AppData\Local\Temp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP=C:\Users\Owner\AppData\Local\Temp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          tzutil /s "Eastern Standard Time"
          # hooks/bin/netlify-guard-global.js runs its token validator with a HARD-CODED
          # interpreter (deliberately not an env var -- see the guard's 2026-10-17 note),
          # so its test died on WinError 2 here: the dev box's Python 3.13 path did not
          # exist. Point that exact path at the setup-python 3.13 install.
          New-Item -ItemType Directory -Force -Path C:\Users\Owner\AppData\Local\Programs\Python | Out-Null
          New-Item -ItemType Junction -Path C:\Users\Owner\AppData\Local\Programs\Python\Python313 -Target $env:pythonLocation | Out-Null
          & C:\Users\Owner\AppData\Local\Programs\Python\Python313\python.exe -I -S -c "import sys; print(sys.version)"

      # Test fixtures create throwaway git repos and commit into them. Runs after the
      # HOME switch so the identity lands in the emulated home's .gitconfig.
      - name: Git identity for fixture repos
        shell: bash
        run: |
          git config --global user.name "ora-ci"
          git config --global user.email "ora-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'

      - name: Run the FULL tracked test suite
        shell: bash
        working-directory: C:\Users\Owner\.claude
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          # The gate's default pool (8) is sized for the 16-core dev box; on this 4-vCPU
          # runner 8 subprocess-heavy files starved each other into 480s x2 timeouts.
          # Lower-only override (hooks/git-prepush-hook-tests-gate.py max_parallel_tests);
          # per-test timeouts are unchanged.
          ORA_GATE_MAX_PARALLEL: "3"
        run: python hooks/git-prepush-hook-tests-gate.py --full
